# Railway Variables (required):
# API_URL=https://pressa-production-d394.up.railway.app
# TRAINER_BOT_TOKEN=...
# ADMIN_API_KEY=...          (same as backend)
# ADMIN_TELEGRAM_IDS=123456   (your Telegram user id)
# SMARTDESK_EXPORT_URL=https://rp-bi.site/api/smartdesk/export
# SMARTDESK_EXPORT_SECRET=...  (same as SMARTDESK_TELEGRAM_WEBHOOK_SECRET on the dashboard)

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"

[[services]]
name = "trainer-bot"
